name: Release build (Linux)

# One Linux platform of the release path, callable per architecture and per update
# channel. Extracted from release.yml's build-linux-x64 job; every way build-linux-arm64
# differed from it is a DECLARED INPUT below or a named unification — nothing inferred
# from the arch. See decisions/2026/08/06/extract-reusable-release-build-workflows.md.
#
# EVERY INPUT IS REQUIRED, NO DEFAULTS. A default publishes the wrong channel, or
# publishes at all from a dry run, with every test still green.

on:
  workflow_call:
    inputs:
      arch:
        description: "x64 or arm64 — feeds cache keys, script args and artifact paths"
        required: true
        type: string
      runsOn:
        description: "Runner label (ubuntu-22.04 for x64, ubuntu-22.04-arm for arm64)"
        required: true
        type: string
      channel:
        description: "stable or canary — prefixes every artifact name and the update manifest"
        required: true
        type: string
      tag:
        description: "Tag or ref being built, used for the versioned S3 prefix"
        required: true
        type: string
      publish:
        # THE MOST DANGEROUS INPUT IN THIS FILE. In release.yml the S3 upload was gated
        # per STEP by `needs.prepare.outputs.publish == 'true'`, and a reusable workflow
        # CANNOT read its caller's `needs` context — so moving the step here without this
        # input would silently turn every dry run into a live publish to the updater feed
        # real users poll, while the run stayed green.
        #
        # Callers MUST pass an explicit boolean comparison:
        #     publish: ${{ needs.prepare.outputs.publish == 'true' }}
        # A job output is a STRING and a non-empty "false" arrives truthy, reproducing the
        # identical catastrophe one file over with this `if:` present and correct.
        description: "Whether to upload to S3. Pass an explicit boolean comparison, never a raw output string."
        required: true
        type: boolean
      bestEffort:
        # linux-arm64 only, today: the Electrobun desktop bundle for that target is not
        # yet proven, and this platform must NEVER block a release of the established
        # ones. Covers the job AND the artifact step as ONE decision — a best-effort job
        # with a hard-failing artifact step is an incoherent combination, so they are not
        # two inputs.
        description: "Allow this platform's GUI bundle to fail without failing the release"
        required: true
        type: boolean

jobs:
  build:
    continue-on-error: ${{ inputs.bestEffort }}
    runs-on: ${{ inputs.runsOn }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: build-update-changelog.ts resolves the previous
          # release tag and diffs the changelog window. The shallow default
          # (fetch-depth 1, no tags) left the update popover empty (decision 152).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # BOUNDED AND RETRIED, because `apt-get update` stalls instead of failing. On 2026-08-19 it
      # hung 27, 45 and 64 minutes across three canary runs, every time after fetching the last
      # `InRelease` and then going silent — no error, no timeout, no output. A hung publish holds
      # the `canary-publish` concurrency group, so one stalled runner queued-then-cancelled every
      # later tick and the channel published nothing for hours.
      #
      # THE MIRROR IS THE CAUSE, THE RETRY IS ONLY THE BACKSTOP — and that order was established
      # by measurement, not assumption. A first probe (32242999970) caught a healthy window and
      # said no mirror was better: every candidate answered 200, azure led the raw fetch at 4.5 MB
      # in 0.03s, and the independent `mirrors.edge.kernel.org` was the slowest real `apt-get
      # update` of six at 30s. That reading did not survive the next stall — see the pin below,
      # which is what the second probe actually measured. Third-party mirrors stay rejected on
      # those numbers; azure does not.
      #
      # `timeout` per command, not just `timeout-minutes` on the step: the step-level bound would
      # kill the job outright, where this retries and only then fails.
      #
      # BUDGETS ARE SIZED OFF THE WORST SUCCESSFUL RUN, NOT THE HEALTHY ONE. The first cut used
      # 180s/480s from a healthy probe, and run 32243397119 would have failed under it: on azure
      # that job needed 151s to update and 927s to install, and it went green at 20m48s. Killing a
      # build that would have shipped is worse than the stall, so update gets 300s per attempt
      # (three attempts) and install 900s — both far above anything the pinned mirror needs.
      - name: Install Linux dependencies
        timeout-minutes: 35
        run: |
          # AZURE DROPPED FROM THE MIRROR LIST, amd64 ONLY, AND IT IS THE WHOLE FIX. The runner
          # image points apt at `deb mirror+file:/etc/apt/apt-mirrors.txt`, priority 1
          # `azure.archive.ubuntu.com`. On 2026-08-19 that host failed two ways on amd64: dead
          # (`Ign:` on every channel, apt then hanging on the fallback for 27, 45 and 64 minutes),
          # and alive but crawling — one run served all 42 packages at 58.3 kB/s and took 15m27s
          # over an `apt-get install` that normally takes seconds.
          #
          # Measured back to back on real runners (probe 32245652275) against the same day's azure
          # numbers: `apt-get update` 4s vs 2m31s, `apt-get install` 9s vs 15m27s. Nothing else
          # here comes close to that, which is why the pin leads and the retry loop below is only
          # the backstop.
          #
          # GUARDED ON dpkg ARCHITECTURE, NOT ON inputs.arch, and arm64 is deliberately left
          # alone. The arm image ships the same list, arm64 was healthy through the whole incident
          # (3s update, 9s install in the probe), and whether `archive.ubuntu.com` serves arm64 at
          # all is NOT verified — so pinning there is unverified risk with no upside. Reading the
          # architecture from the runner cannot drift from the runner the way an input can.
          if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            echo "pinned apt mirrors:"; cat /etc/apt/apt-mirrors.txt
          else
            echo "apt mirror list left untouched ($(dpkg --print-architecture))"
          fi
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          updated=0
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get update "${apt_opts[@]}"; then
              updated=1
              break
            fi
            echo "::warning::apt-get update attempt $attempt stalled or failed; retrying"
            sleep 10
          done
          if [ "$updated" != 1 ]; then
            echo "::error::apt-get update stalled three times — Ubuntu mirrors or runner egress are degraded"
            exit 1
          fi
          sudo timeout 900 apt-get install -y "${apt_opts[@]}" \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Deliberately NOT cached: measured, a cache hit restored in 7s where `bun install`
      # takes 5s, and the entries ate 4.8 GiB of the 10 GB repo cache the Windows proof needs.
      - name: Install dependencies
        run: bun install

      # Pinned model-catalog proxy sidecar (decisions/2026/08/15/model-catalog-and-model-roles.md).
      # Fetching is gated on a recorded pin: a pinned target that 404s or whose
      # checksum drifts FAILS the build; an unpinned one ships without the
      # catalog, which the app reports plainly instead of crashing.
      - name: Fetch pinned model proxy
        run: |
          if [ -f scripts/bifrost-pinned.json ]; then
            bun scripts/fetch-bifrost.ts
            bun scripts/smoke-bifrost.ts
          else
            echo "::warning title=Model catalog disabled::scripts/bifrost-pinned.json is absent — this build ships no model proxy. Record a pin with 'bun scripts/fetch-bifrost.ts --record'."
          fi

      - name: Clean build directory
        run: rm -rf ./build ./artifacts

      - name: Build release
        env:
          # Vite inlines these at build time; missing values leave PostHog in no-op mode.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          COPYFILE_DISABLE: "1"
          COPY_EXTENDED_ATTRIBUTES_DISABLE: "1"
        run: |
          bun scripts/generate-build-info.ts
          bun scripts/generate-changelog.ts
          bunx vite build
          bun run build:cli
          bunx electrobun build --env=${{ inputs.channel }} || echo "::warning::electrobun build exited with $? (recovering artifacts)"

      - name: Debug build output
        if: always()
        run: |
          echo "=== ./build/ ==="
          find ./build -maxdepth 3 -type f 2>/dev/null || echo "(empty)"
          echo "=== ./artifacts/ ==="
          ls -lhR ./artifacts/ 2>/dev/null || echo "(empty)"

      - name: Create CLI tarball
        run: bash ./scripts/create-cli-tarball.sh linux ${{ inputs.arch }}

      # Best-effort on platforms whose GUI runtime may not exist yet (linux-arm64):
      # `bestEffort` lets the step FAIL VISIBLY while the job continues, instead of the
      # old `|| echo ::warning::` which made a missing bundle look like a passing step.
      - name: Create release artifacts
        continue-on-error: ${{ inputs.bestEffort }}
        run: bash ./scripts/create-release-artifacts.sh linux ${{ inputs.arch }} ${{ inputs.channel }}

      - name: Upload artifacts to S3
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        run: |
          TAG="${{ inputs.tag }}"
          aws s3 sync "./artifacts-linux-${{ inputs.arch }}/" "s3://h0x91b-releases/dev-3.0/$TAG/"
          # THE MANIFEST GOES LAST, AND IT IS THE ONLY FILE CLIENTS DISCOVER BUILDS THROUGH.
          # One sync of the whole directory uploaded `*-update.json` FIRST on 4 of 4 platforms
          # (measured on run 31091740061), leaving a 2.25-2.99s window in which the manifest
          # advertised a tarball that was not at the root path yet. Splitting the root sync in
          # two closes that window; it does NOT make the publish atomic, and does not need to —
          # a client polling between the two syncs reads the PREVIOUS manifest, which is correct.
          aws s3 sync "./artifacts-linux-${{ inputs.arch }}/" "s3://h0x91b-releases/dev-3.0/" \
            --exclude "*.dmg" --exclude "*Setup*.tar.gz" --exclude "dev3-cli-*.tar.gz" \
            --exclude "*-update.json"
          aws s3 cp "./artifacts-linux-${{ inputs.arch }}/${{ inputs.channel }}-linux-${{ inputs.arch }}-update.json" \
            "s3://h0x91b-releases/dev-3.0/"

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@v5
        with:
          name: artifacts-linux-${{ inputs.arch }}
          path: ./artifacts-linux-${{ inputs.arch }}/
