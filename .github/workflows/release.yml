name: Release

# Publishing runs ONLY for v* tags. Two dry-run paths build, sign, notarize
# and gate everything identically but skip all user-visible publishing
# (S3 syncs incl. the updater feed at the bucket root, GitHub Release, brew):
#   - push a `test-*` tag (works from any branch, pre-merge)
#   - `gh workflow run release.yml --ref <branch>` (workflow_dispatch;
#     available once this file is on the default branch)
# Dry-run artifacts (DMGs etc.) are still uploaded as GitHub Actions
# artifacts on the run page.
on:
  push:
    tags: ["v*", "test-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────
  # Determine version from tag
  # ──────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog preview step can resolve the
          # previous release tag (same requirement as the build jobs).
          fetch-depth: 0

      - name: Determine version tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "push" ] && [[ "$TAG" == v* ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "Version tag: $TAG (publishing release)"
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "DRY RUN for ref '$TAG' — build/sign/verify only, nothing published"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Preview update popover changelog
        # Surface the exact "what's new" payload that gets embedded into
        # update.json, so the run summary makes it obvious whether the popover
        # will show anything (empty features ⇒ users see a bare popover).
        run: |
          bun scripts/generate-changelog.ts
          PAYLOAD="$(bun scripts/build-update-changelog.ts)"
          echo "update.json changelog payload: $PAYLOAD"
          FEATURES="$(echo "$PAYLOAD" | jq -r '.featureCount')"
          FIXES="$(echo "$PAYLOAD" | jq -r '.fixCount')"
          {
            echo "## Update popover — what's new in ${{ github.ref_name }}"
            echo ""
            echo "Embedded into \`update.json\`; shown by the *previous* version's popover. Empty features ⇒ users see a bare popover."
            echo ""
            echo "**Features: ${FEATURES} · Fixes: ${FIXES}**"
            echo ""
            echo "$PAYLOAD" | jq -r '.features[] | "- " + .'
            echo ""
            echo "<details><summary>raw update.json changelog</summary>"
            echo ""
            echo '```json'
            echo "$PAYLOAD" | jq .
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FEATURES" = "0" ] && [ "$FIXES" = "0" ]; then
            echo "::warning title=Empty update changelog::update.json will ship an empty what's-new popover (no feature/fix entries in the release window)"
          fi

  # ──────────────────────────────────────────────────
  # The packaged Windows proof, BEFORE anything publishes
  # ──────────────────────────────────────────────────
  # Arseny: if it cannot build Windows at version-build time, it should fail there.
  #
  # This has to gate the BUILD jobs, not the `release` job, and the reason is that
  # publishing is DECENTRALISED: build-macos-arm64, build-macos-x64, build-linux-x64
  # and build-linux-arm64 each run their own `aws s3 sync`, including the sync to the
  # bucket ROOT, which is the updater feed. Gating only `release` would fail the GitHub
  # Release after macOS had already shipped to updater clients — a partial ship wearing
  # a failed release's clothes. Do not "simplify" this onto `release`.
  # `workflow-windows-proof.test.ts` asserts every job that syncs the feed depends on
  # this one, by detecting publishers from their sync step rather than by name, so a
  # publisher added later is covered the moment it exists.
  # See decisions/2026/08/06/windows-proof-post-merge-not-pull-request.md.
  windows-proof:
    needs: prepare
    uses: ./.github/workflows/windows-conpty-package.yml

  # ──────────────────────────────────────────────────
  # Build for each platform (parallel)
  # ──────────────────────────────────────────────────
  # ──────────────────────────────────────────────────
  # Per-platform builds — one reusable workflow per OS, called once per arch.
  #
  # `secrets: inherit` is required: the called workflows use the signing, notarization
  # and AWS secrets, and a reusable workflow receives NO secrets by default.
  #
  # `publish` is passed as an EXPLICIT BOOLEAN COMPARISON, never the raw output. A job
  # output is a string, and a non-empty "false" arrives truthy at a boolean input — which
  # would make every dry run publish to the live updater feed while the run stayed green.
  # `workflow-windows-proof.test.ts` asserts this call-site form.
  # ──────────────────────────────────────────────────
  build-macos-arm64:
    needs: [prepare, windows-proof]
    uses: ./.github/workflows/release-build-macos.yml
    secrets: inherit
    with:
      arch: arm64
      runsOn: macos-15
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  build-macos-x64:
    needs: [prepare, windows-proof]
    uses: ./.github/workflows/release-build-macos.yml
    secrets: inherit
    with:
      arch: x64
      runsOn: macos-15-intel
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  # WINDOWS, UNSIGNED, ON PURPOSE. windows-ships-through-canary-first.md said this caller would
  # never exist; Arseny asked for the release page as well as the canary channel, and for a
  # runnable download even if it is rough. There is no code-signing certificate and there will not
  # be one, so the first launch shows SmartScreen — which is why the Windows section of the
  # release body is generated by the build job (from its own launch proof) rather than written
  # here, warning included. See decisions/2026/08/14/windows-zip-on-the-release-page.md.
  #
  # FAIL-CLOSED, exactly like the macOS legs. Windows was best-effort until Arseny made it a
  # first-class platform: "теперь надо фейлить всё" — a broken Windows build now stops the whole
  # release, the macOS disk images included. There is no input to soften this, on purpose.
  #
  # THE COST IS REAL AND ACCEPTED: this job runs in parallel with macOS and Linux, so a Windows
  # failure can land after those legs have already run their own `aws s3 sync` to the bucket root
  # that feeds the updater. The tag then has a published update and no GitHub Release, and the
  # fix is to re-run the run rather than to tolerate the failure.
  # See decisions/2026/08/14/windows-failure-fails-the-release.md.
  build-win-x64:
    needs: [prepare, windows-proof]
    uses: ./.github/workflows/release-build-windows.yml
    secrets: inherit
    with:
      arch: x64
      runsOn: windows-latest
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  build-linux-x64:
    needs: [prepare, windows-proof]
    uses: ./.github/workflows/release-build-linux.yml
    secrets: inherit
    with:
      arch: x64
      runsOn: ubuntu-22.04
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
      bestEffort: false

  build-linux-arm64:
    needs: [prepare, windows-proof]
    uses: ./.github/workflows/release-build-linux.yml
    secrets: inherit
    with:
      arch: arm64
      runsOn: ubuntu-22.04-arm
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      # linux-arm64's GUI bundle may not exist yet; it must never block a release of the
      # established platforms. Declared here rather than inferred from the arch.
      bestEffort: true
      publish: ${{ needs.prepare.outputs.publish == 'true' }}


  release:
    needs: [prepare, build-macos-arm64, build-macos-x64, build-win-x64, build-linux-x64, build-linux-arm64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so build-release-notes.ts can resolve the
          # previous release tag for the changelog window (decision 152).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lhR all-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          S3_BASE="https://h0x91b-releases.s3.eu-west-1.amazonaws.com/dev-3.0/$TAG"

          # Full "what's new" (Features → Fixes → Refactors) for the release
          # window. Empty output (no entries) simply omits the section.
          bun scripts/generate-changelog.ts >/dev/null
          bun scripts/build-release-notes.ts "$TAG" > /tmp/release-notes.md

          {
            echo ""
            echo "## Download"
            echo ""

            # macOS Apple Silicon
            if ls all-artifacts/*macos-arm64*.dmg 1>/dev/null 2>&1; then
              echo "### macOS (Apple Silicon)"
              echo "- [\`stable-macos-arm64-dev-3.0.dmg\`]($S3_BASE/stable-macos-arm64-dev-3.0.dmg)"
              echo ""
            fi

            # macOS Intel
            if ls all-artifacts/*macos-x64*.dmg 1>/dev/null 2>&1; then
              echo "### macOS (Intel)"
              echo "- [\`stable-macos-x64-dev-3.0.dmg\`]($S3_BASE/stable-macos-x64-dev-3.0.dmg)"
              echo ""
            fi

            # Windows (x64). The section is GENERATED BY THE WINDOWS BUILD JOB from its own
            # launch proof (scripts/package-windows-launched-tree.ts) and appended verbatim: only
            # that job knows which executable the proof actually spawned, and only it can carry
            # the unsigned-launch warning that stops a SmartScreen dialog reading as a malware
            # verdict. No fragment ⇒ no Windows section, instead of a guessed one.
            if [ -f all-artifacts/windows-release-notes.md ]; then
              cat all-artifacts/windows-release-notes.md
              echo ""
            fi

            # Linux (x64)
            if ls all-artifacts/*linux-x64*.tar.zst 1>/dev/null 2>&1; then
              echo "### Linux (x64)"
              echo "- [\`stable-linux-x64-dev-3.0.tar.zst\`]($S3_BASE/stable-linux-x64-dev-3.0.tar.zst)"
              echo ""
            fi

            # Linux (arm64) — best-effort; the GUI bundle may be absent until the
            # Electrobun arm64 runtime ships, but the CLI tarball still publishes.
            if ls all-artifacts/*linux-arm64*.tar.zst 1>/dev/null 2>&1; then
              echo "### Linux (arm64)"
              echo "- [\`stable-linux-arm64-dev-3.0.tar.zst\`]($S3_BASE/stable-linux-arm64-dev-3.0.tar.zst)"
              echo ""
            fi

            echo "### All artifacts"
            echo ""
            for file in all-artifacts/*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              # Every entry here is a bucket link, so anything that never reaches the bucket must
              # be skipped or it ships as a dead download. windows-release-notes.md is prose the
              # Windows job hands to this workflow, not a published file.
              [ "$name" = "windows-release-notes.md" ] && continue
              echo "- [\`$name\`]($S3_BASE/$name)"
            done
          } >> /tmp/release-notes.md

          echo "=== Release notes ==="
          cat /tmp/release-notes.md

          # Create or update the release
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG exists, updating..."
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --notes-file /tmp/release-notes.md
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Upload DMGs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          for dmg in all-artifacts/*.dmg; do
            [ -f "$dmg" ] || continue
            echo "Uploading $(basename "$dmg") to release $TAG"
            gh release upload "$TAG" "$dmg" --repo "${{ github.repository }}" --clobber
          done

      # THE WHOLE POINT OF THE WINDOWS LEG: a file a human can click on the release page. The
      # `.tar.zst` is deliberately not uploaded here — Windows `tar.exe` cannot read zstd, so it
      # is the updater's file, not a person's.
      - name: Upload the launched Windows zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          for zip in all-artifacts/*win-x64*.zip; do
            [ -f "$zip" ] || continue
            name=$(basename "$zip")
            # The self-extracting installer is built by every Windows build and has NEVER been
            # launched by any job, test or proof. Handing it out would put the unvetted binary in
            # front of users while the proven one stayed decoration — see
            # decisions/2026/08/06/downloadable-windows-build-is-the-launched-tree.md.
            case "$name" in
              *Setup*)
                echo "::warning title=Windows installer not published::$name is the self-extracting installer. Nothing has ever launched it, so it is not attached to the release. Closing that gap means growing verify:win-app-launch a second target."
                continue
                ;;
            esac
            echo "Uploading $name to release $TAG"
            gh release upload "$TAG" "$zip" --repo "${{ github.repository }}" --clobber
          done

      - name: Upload CLI tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          for tarball in all-artifacts/dev3-cli-*.tar.gz; do
            [ -f "$tarball" ] || continue
            echo "Uploading $(basename "$tarball") to release $TAG"
            gh release upload "$TAG" "$tarball" --repo "${{ github.repository }}" --clobber
          done

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          DMG_PATH="all-artifacts/stable-macos-arm64-dev-3.0.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "::warning::ARM64 DMG not found, skipping Homebrew update"
            exit 0
          fi

          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "Updating Homebrew Cask: version=${VERSION} sha256=${SHA256}"

          rm -rf /tmp/homebrew-dev3
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/h0x91b/homebrew-dev3.git" /tmp/homebrew-dev3
          mkdir -p /tmp/homebrew-dev3/Casks

          # Regenerate the full cask each release (instead of sed-ing
          # version/sha256). This keeps `depends_on` and other metadata under
          # version control in this repo's release.yml — single source of truth.
          cat > /tmp/homebrew-dev3/Casks/dev3.rb <<EOF
          cask "dev3" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/h0x91b/dev-3.0/releases/download/v#{version}/stable-macos-arm64-dev-3.0.dmg"
            name "dev-3.0"
            desc "Terminal-centric project manager for AI coding agents"
            homepage "https://h0x91b.github.io/dev-3.0/"

            # The app updates itself via the in-app updater, so most installs
            # drift ahead of the Caskroom-recorded version. Without this flag a
            # bulk \`brew upgrade\` tries to "upgrade" such installs and can rip
            # the bundle from under a running instance (or die mid-move on the
            # stale Caskroom state). auto_updates makes bulk \`brew upgrade\`
            # skip dev3; an explicit \`brew upgrade --cask dev3\` still works.
            auto_updates true
            depends_on arch: :arm64
            depends_on macos: :ventura
            depends_on formula: "git"
            # No tmux dependency: the app bundle ships its own self-contained
            # pinned tmux (Resources/app/tmux) — see decisions/2026/07/16/bundle-tmux-macos.md. Existing
            # installs with the h0x91b/dev3/tmux@3.6 keg keep working (the keg
            # is the second resolution tier after the bundled binary).
            depends_on formula: "cloudflared"

            app "dev-3.0.app"

            zap trash: [
              "~/Library/Application Support/dev3.electrobun.dev",
              "~/Library/Caches/dev3.electrobun.dev",
              "~/Library/Preferences/dev3.electrobun.dev.plist",
            ]
          end
          EOF

          cd /tmp/homebrew-dev3
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dev3.rb
          if git diff --cached --quiet; then
            echo "Homebrew Cask already up to date (no changes)"
            exit 0
          fi
          git commit -m "Update dev3 to ${VERSION}"
          git push origin main

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          S3_BASE="https://h0x91b-releases.s3.eu-west-1.amazonaws.com/dev-3.0/$TAG"

          MACOS_ARM64="all-artifacts/dev3-cli-macos-arm64.tar.gz"
          MACOS_X64="all-artifacts/dev3-cli-macos-x64.tar.gz"
          LINUX_X64="all-artifacts/dev3-cli-linux-x64.tar.gz"
          LINUX_ARM64="all-artifacts/dev3-cli-linux-arm64.tar.gz"

          # linux-arm64 is NOT in the hard requirement below — it's a best-effort
          # platform, so a missing arm64 tarball must not block the x64/macOS
          # formula update. It's added to the formula conditionally further down.
          if [ ! -f "$LINUX_X64" ] || [ ! -f "$MACOS_ARM64" ] || [ ! -f "$MACOS_X64" ]; then
            echo "::warning::CLI tarballs missing for one or more platforms — skipping Formula update"
            ls -lh all-artifacts/dev3-cli-*.tar.gz 2>/dev/null || echo "(none)"
            exit 0
          fi

          MACOS_ARM64_SHA=$(shasum -a 256 "$MACOS_ARM64" | awk '{print $1}')
          MACOS_X64_SHA=$(shasum -a 256 "$MACOS_X64" | awk '{print $1}')
          LINUX_X64_SHA=$(shasum -a 256 "$LINUX_X64" | awk '{print $1}')
          echo "Formula sha256: macos-arm64=$MACOS_ARM64_SHA macos-x64=$MACOS_X64_SHA linux-x64=$LINUX_X64_SHA"

          # Conditionally add the linux-arm64 bottle. Built with first-line indent
          # bare (the heredoc placeholder supplies it) and 6-space body indent so it
          # nests correctly under `on_linux do`. Empty when the arm64 tarball wasn't
          # produced, which collapses to a harmless blank line in the formula.
          LINUX_ARM_BLOCK=""
          if [ -f "$LINUX_ARM64" ]; then
            LINUX_ARM64_SHA=$(shasum -a 256 "$LINUX_ARM64" | awk '{print $1}')
            echo "Formula includes linux-arm64: sha256=$LINUX_ARM64_SHA"
            LINUX_ARM_BLOCK=$(printf 'on_arm do\n        url "%s/dev3-cli-linux-arm64.tar.gz"\n        sha256 "%s"\n      end' "$S3_BASE" "$LINUX_ARM64_SHA")
          else
            echo "::warning::linux-arm64 CLI tarball missing — Formula will omit the Linux arm64 bottle"
          fi

          rm -rf /tmp/homebrew-dev3
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/h0x91b/homebrew-dev3.git" /tmp/homebrew-dev3
          mkdir -p /tmp/homebrew-dev3/Formula

          cat > /tmp/homebrew-dev3/Formula/dev3.rb <<EOF
          class Dev3 < Formula
            desc "Terminal-centric project manager for AI coding agents (CLI + headless)"
            homepage "https://h0x91b.github.io/dev-3.0/"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${S3_BASE}/dev3-cli-macos-arm64.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              end
              on_intel do
                url "${S3_BASE}/dev3-cli-macos-x64.tar.gz"
                sha256 "${MACOS_X64_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "${S3_BASE}/dev3-cli-linux-x64.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              end
              ${LINUX_ARM_BLOCK}
            end

            # No tmux dependency on macOS: the tarball ships a self-contained
            # pinned tmux next to the binary (decisions/2026/07/16/bundle-tmux-macos.md). Linux tarballs
            # don't carry it yet, so Linux keeps the pinned keg — without it a
            # fresh Linux install on a tmux-less box would have no tmux at all.
            on_linux do
              depends_on "h0x91b/dev3/tmux@3.6"
            end
            depends_on "git"
            depends_on "cloudflared"

            def install
              # artifact-template ships in every CLI tarball (create-cli-tarball.sh)
              # and MUST land next to the binary in libexec — the app resolves it at
              # libexec/artifact-template. Without it, launching ANY task fails with
              # "Bundled dev3 artifact template not found".
              libexec.install "dev3", "dist", "artifact-template"
              chmod 0755, libexec/"dev3"
              # Bundled self-contained tmux (macOS tarballs only). The app
              # resolves it at libexec/tmux/tmux — next to the real binary,
              # same layout as the extracted tarball.
              if File.exist?("tmux")
                libexec.install "tmux"
                chmod 0755, libexec/"tmux/tmux"
              end
              # \`dev3\` is a single binary that is both the CLI and the headless
              # server (\`dev3 remote\` boots the server in-process). It serves the
              # UI from the sibling \`dist/\` resolved via realpath(execPath), so it
              # finds itself next to the real binary in libexec.
              bin.install_symlink libexec/"dev3"
            end

            test do
              assert_match "dev3", shell_output("#{bin}/dev3 --version")
            end
          end
          EOF

          cd /tmp/homebrew-dev3
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dev3.rb
          if git diff --cached --quiet; then
            echo "Homebrew Formula already up to date (no changes)"
            exit 0
          fi
          git commit -m "Update dev3 formula to ${VERSION}"
          git push origin main
