# Opt-in native terminal soak gate (seq 1301).
#
# MANUAL ONLY — `workflow_dispatch`, never `pull_request`. The soak drives real
# detached hosts through sustained load, reconnect churn, a crash, and create/stop
# cycles; it takes minutes and is deliberately absent from the required PR checks
# so normal review never pays for it.
name: Native terminal soak

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner to soak on
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - macos-latest
          - ubuntu-latest
      sessions:
        description: Concurrent native sessions
        default: "4"
      reconnects:
        description: Forced disconnect/reconnect cycles (16 minimum for growth verdicts)
        default: "24"
      createStop:
        description: Repeated create/stop cycles
        default: "6"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Soak harness unit tests
        run: bunx vitest run --config vitest.config.bun.ts src/bun/native-terminal-soak

      - name: Multi-session soak
        run: >-
          bun src/bun/native-terminal-soak/run-soak.ts
          --sessions ${{ inputs.sessions }}
          --reconnects ${{ inputs.reconnects }}
          --create-stop ${{ inputs.createStop }}
          --out soak-summary.json

      - name: Upload soak summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-terminal-soak-${{ inputs.os }}
          path: soak-summary.json
          if-no-files-found: warn
