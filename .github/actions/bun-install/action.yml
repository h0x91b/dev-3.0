name: bun install (bounded retry)
description: >-
  Install dependencies with a bounded, loudly announced retry, so a transient
  registry tarball failure does not fail an unrelated job.
inputs:
  frozen-lockfile:
    description: Pass --frozen-lockfile to bun install.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # The action adds no caching of its own: measured, a posix cache hit restored in 7s where
    # `bun install` takes 5s. The call sites where the install really is slow (Windows, ~255s)
    # keep their own actions/cache restore step around this one.
    - name: Install dependencies
      shell: bash
      env:
        FROZEN: ${{ inputs.frozen-lockfile }}
      run: |
        args=()
        if [ "$FROZEN" = "true" ]; then args+=(--frozen-lockfile); fi
        bash "$GITHUB_ACTION_PATH/install-with-retry.sh" "${args[@]}"
